name: 每日股票資料抓取

on:
  schedule:
    - cron: '30 6 * * 1-5'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas
      - run: python scripts/fetch_broker.py
      - run: python scripts/fetch_chips.py
      - run: python scripts/calc_watchlist.py
      - run: python scripts/fetch_us_candles.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "📊 自動更新：$(date '+%Y-%m-%d %H:%M')"
          git push
