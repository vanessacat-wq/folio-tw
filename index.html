<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folio — Stock Intelligence</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f5f0;--surface:#fff;--surface2:#f0ede8;--border:#e8e3dc;
  --text:#1a1814;--text2:#6b6560;--text3:#a09890;
  --up:#1a8a5a;--down:#c0392b;--neutral:#5a6a8a;
  --accent:#2d3561;--accent2:#e8a020;--cnbc:#cc0000;
  --radius:14px;--radius-sm:8px;
  --shadow:0 2px 20px rgba(0,0,0,0.06);--shadow-lg:0 8px 40px rgba(0,0,0,0.10);
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.sidebar{background:var(--accent);padding:28px 20px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.main{padding:28px;overflow-x:hidden}
.logo{font-family:'DM Serif Display',serif;font-size:22px;color:#fff;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,0.12);letter-spacing:-0.5px}
.logo span{color:var(--accent2);font-style:italic}
.nav-label{font-size:10px;letter-spacing:.1em;color:rgba(255,255,255,0.35);text-transform:uppercase;padding:12px 10px 4px;font-weight:500}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:all .2s;color:rgba(255,255,255,0.6);font-size:13.5px}
.nav-item:hover{background:rgba(255,255,255,0.1);color:#fff}
.nav-item.active{background:rgba(255,255,255,0.15);color:#fff;font-weight:500}
.nav-dot{width:6px;height:6px;border-radius:50%;margin-left:auto}
.dot-up{background:#4ade80}.dot-down{background:#f87171}
.cnbc-nav-badge{font-size:9px;background:var(--cnbc);color:#fff;padding:1px 5px;border-radius:3px;font-weight:700;margin-left:2px}
.wl-section{margin-top:auto;border-top:1px solid rgba(255,255,255,0.1);padding-top:16px}
.wm-item{display:flex;justify-content:space-between;align-items:center;padding:5px 4px;font-size:12px;cursor:pointer}
.wm-ticker{color:rgba(255,255,255,0.85);font-weight:500}
.wm-chg{font-size:11px;font-weight:500}
.chg-up{color:#4ade80}.chg-down{color:#f87171}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:16px}
.page-title{font-family:'DM Serif Display',serif;font-size:26px;letter-spacing:-0.5px}
.page-sub{font-size:13px;color:var(--text2);margin-top:2px}
.search-bar{display:flex;gap:8px;flex-shrink:0}
#searchInput{border:1.5px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);padding:9px 14px;font-size:13px;font-family:'DM Sans',sans-serif;width:260px;outline:none;color:var(--text);transition:border .2s}
#searchInput:focus{border-color:var(--accent)}
.btn{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:9px 18px;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;font-weight:500;transition:all .2s;white-space:nowrap}
.btn:hover{opacity:.88;transform:translateY(-1px)}
.btn-sm{padding:6px 14px;font-size:12px}
.btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--text2)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:transparent}
.btn-cnbc{background:var(--cnbc)}
.chips{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.chip{background:var(--surface);border:1.5px solid var(--border);border-radius:20px;padding:5px 14px;font-size:12px;cursor:pointer;transition:all .2s;color:var(--text2)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:20px;box-shadow:var(--shadow)}
.section-title{font-family:'DM Serif Display',serif;font-size:18px;margin-bottom:14px;color:var(--text)}
.card-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);font-weight:500;margin-bottom:5px}
.stock-hero{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:24px;box-shadow:var(--shadow);margin-bottom:20px}
.stock-name{font-family:'DM Serif Display',serif;font-size:24px;letter-spacing:-0.5px}
.ticker-badge{display:inline-block;background:var(--surface2);border-radius:5px;padding:2px 9px;font-size:12px;font-weight:600;color:var(--text2);margin-left:6px;vertical-align:middle}
.stock-price{font-size:34px;font-weight:600;letter-spacing:-1px}
.stock-chg{font-size:15px;font-weight:500;margin-top:3px}
.up{color:var(--up)}.down{color:var(--down)}
.rating-ring{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:4px solid;flex-shrink:0}
.ring-buy{border-color:var(--up);color:var(--up);background:#f0fff8}
.ring-sell{border-color:var(--down);color:var(--down);background:#fff5f5}
.ring-hold{border-color:#f59e0b;color:#b45309;background:#fffbeb}
.ring-watch{border-color:var(--neutral);color:var(--neutral);background:#f0f4ff}
.signal-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.signal-row:last-child{border-bottom:none}
.sig-bar-wrap{flex:1;height:4px;background:var(--surface2);border-radius:2px}
.sig-bar{height:100%;border-radius:2px;transition:width .5s}
.bar-g{background:var(--up)}.bar-r{background:var(--down)}.bar-y{background:#f59e0b}
.chart-wrap{position:relative;height:240px}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.tag-buy{background:#d1fae5;color:#065f46}.tag-sell{background:#fee2e2;color:#991b1b}
.tag-hold{background:#fef3c7;color:#92400e}.tag-watch{background:#e0e7ff;color:#3730a3}
.news-item{padding:10px 0;border-bottom:1px solid var(--border)}
.news-item:last-child{border-bottom:none}
.news-headline{font-size:13px;font-weight:500;line-height:1.4;margin-bottom:4px}
.news-meta{font-size:11px;color:var(--text3);display:flex;gap:8px;align-items:center}
.sent-pos{background:#d1fae5;color:#065f46;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600}
.sent-neg{background:#fee2e2;color:#991b1b;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600}
.sent-neu{background:#f1f5f9;color:#475569;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600}
.forecast-bar{position:relative;height:32px;background:var(--surface2);border-radius:8px;margin:10px 0;overflow:hidden}
.forecast-range{position:absolute;height:100%;background:linear-gradient(90deg,#d1fae5,#a7f3d0)}
.forecast-pin{position:absolute;width:3px;background:var(--accent);height:100%;top:0}
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{text-align:left;color:var(--text3);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:7px 10px;border-bottom:2px solid var(--border)}
.data-table td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:var(--surface2)}
.ft-panel{background:var(--surface);border-radius:var(--radius);border:2px solid #e8c8c8;box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
.ft-header{background:#1c0000;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.ft-cnbc{background:var(--cnbc);color:#fff;font-weight:800;font-size:13px;padding:4px 10px;border-radius:4px;letter-spacing:.08em;flex-shrink:0}
.ft-titles{flex:1;margin-left:12px}
.ft-title{color:#fff;font-family:'DM Serif Display',serif;font-size:17px}
.ft-sub{color:rgba(255,255,255,0.4);font-size:11px;margin-top:2px}
.ft-yt{color:rgba(255,255,255,0.5);font-size:11px;border:1px solid rgba(255,255,255,0.2);padding:5px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:all .2s;text-decoration:none;white-space:nowrap}
.ft-yt:hover{color:#fff;border-color:rgba(255,255,255,0.5)}
.ft-body{padding:18px 22px}
.ft-hint{font-size:12px;color:var(--text3);margin-bottom:12px}
.ft-input-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ft-input{flex:1;min-width:160px;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:9px 14px;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--text);background:var(--bg);outline:none;transition:border .2s}
.ft-input:focus{border-color:var(--cnbc)}
.ft-pills-row{display:flex;gap:8px;flex-wrap:wrap;min-height:28px;align-items:center;margin-bottom:4px}
.ft-pill{display:inline-flex;align-items:center;gap:6px;background:#fff0f0;border:1.5px solid #fca5a5;border-radius:20px;padding:4px 10px 4px 13px;font-size:13px;font-weight:600;color:#991b1b}
.ft-pill button{background:none;border:none;cursor:pointer;color:#fca5a5;font-size:16px;line-height:1;padding:0}
.ft-pill button:hover{color:var(--down)}
.ft-pill-trader{font-size:10px;font-weight:400;color:#c08080;margin-left:2px}
.ft-divider{border:none;border-top:1px solid var(--border);margin:14px 0}
.ft-results-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ft-results-title{font-size:13px;font-weight:500;color:var(--text)}
.ft-results{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.ft-card{background:var(--bg);border-radius:var(--radius-sm);border:1.5px solid var(--border);padding:16px;cursor:pointer;transition:all .2s}
.ft-card:hover{border-color:#b0bcd8;transform:translateY(-2px);box-shadow:var(--shadow)}
.ft-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.ft-sym{font-family:'DM Serif Display',serif;font-size:20px}
.ft-sname{font-size:11px;color:var(--text3);margin-top:1px;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft-trader-lbl{font-size:10px;color:var(--text3);font-style:italic;margin-top:2px}
.ft-price{font-size:20px;font-weight:600;letter-spacing:-.5px}
.ft-chg{font-size:11px;font-weight:500;margin-top:1px}
.ft-bar-track{height:3px;background:var(--border);border-radius:2px;margin:10px 0 6px;overflow:hidden}
.ft-bar-fill{height:100%;border-radius:2px;transition:width .7s}
.ft-card-foot{display:flex;justify-content:space-between;align-items:center}
.ft-rpill{padding:2px 9px;border-radius:10px;font-size:10px;font-weight:700}
.rp-buy{background:#d1fae5;color:#065f46}.rp-sell{background:#fee2e2;color:#991b1b}
.rp-hold{background:#fef3c7;color:#92400e}.rp-watch{background:#e0e7ff;color:#3730a3}
.ft-loading-card{display:flex;align-items:center;justify-content:center;gap:8px;height:100px;color:var(--text3);font-size:12px}
.ft-empty{text-align:center;padding:20px;color:var(--text3);font-size:13px}
.loading{display:flex;align-items:center;gap:8px;color:var(--text3);font-size:13px;padding:40px;justify-content:center}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err-msg{background:#fff5f5;border:1px solid #fecaca;border-radius:var(--radius-sm);padding:12px 16px;font-size:13px;color:#991b1b;margin-bottom:16px}
.welcome-state{text-align:center;padding:50px 20px}
.welcome-icon{font-size:44px;margin-bottom:14px;opacity:.2}
.welcome-title{font-family:'DM Serif Display',serif;font-size:24px;margin-bottom:10px}
.welcome-desc{font-size:14px;color:var(--text2);line-height:1.65;max-width:400px;margin:0 auto 22px}
.mb-panel{background:var(--surface);border-radius:var(--radius);border:1.5px solid #c8e6c9;box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
.mb-header{background:linear-gradient(135deg,#0d3320,#1a5c35);padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.mb-badge{background:#1a8a5a;color:#fff;font-weight:700;font-size:12px;padding:4px 10px;border-radius:4px;letter-spacing:.05em}
.mb-titles{flex:1;margin-left:12px}
.mb-title{color:#fff;font-family:'DM Serif Display',serif;font-size:17px}
.mb-sub{color:rgba(255,255,255,0.45);font-size:11px;margin-top:2px}
.mb-updated{color:rgba(255,255,255,0.4);font-size:11px;white-space:nowrap}
.mb-body{padding:18px 22px}
.mb-tabs{display:flex;gap:4px;background:var(--surface2);border-radius:var(--radius-sm);padding:4px;width:fit-content;margin-bottom:16px}
.mb-tab{padding:6px 16px;border-radius:6px;font-size:12px;cursor:pointer;color:var(--text2);transition:all .2s}
.mb-tab.active{background:var(--surface);color:var(--text);font-weight:500;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
.mb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.mb-card{background:var(--bg);border-radius:var(--radius-sm);border:1.5px solid var(--border);padding:16px;cursor:pointer;transition:all .2s;position:relative}
.mb-card:hover{border-color:#1a8a5a;transform:translateY(-2px);box-shadow:var(--shadow)}
.mb-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.mb-sym{font-family:'DM Serif Display',serif;font-size:19px}
.mb-name{font-size:11px;color:var(--text3);margin-top:1px}
.mb-gates{display:flex;gap:4px;margin-bottom:8px}
.gate-dot{width:8px;height:8px;border-radius:50%}
.gate-pass{background:var(--up)}.gate-fail{background:var(--down)}.gate-unknown{background:#d1d5db}
.mb-stat{font-size:11px;color:var(--text2);display:flex;justify-content:space-between;padding:2px 0}
.mb-stat span:last-child{font-weight:500;color:var(--text)}
.mb-score-badge{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.score-full{background:#d1fae5;color:#065f46}
.score-partial{background:#fef3c7;color:#92400e}
.mb-empty{text-align:center;padding:30px;color:var(--text3);font-size:13px}
.mb-ranking-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:background .15s;border-bottom:1px solid var(--border)}
.mb-ranking-row:last-child{border-bottom:none}
.mb-ranking-row:hover{background:var(--surface2)}
.mb-rank-num{font-size:13px;font-weight:700;color:var(--text3);min-width:24px}
.mb-rank-sym{font-weight:600;font-size:14px;color:var(--text);min-width:60px}
.mb-rank-name{font-size:12px;color:var(--text3);flex:1}
.mb-rank-net{font-size:13px;font-weight:600;color:var(--up);min-width:60px;text-align:right}
.mb-rank-days{font-size:11px;color:var(--text3);min-width:50px;text-align:right}
/* K線資料來源標籤 */
.chart-source{font-size:10px;color:var(--text3);text-align:right;margin-top:4px}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{display:none}.grid-4{grid-template-columns:1fr 1fr}}
</style>
</head>

<div class="app">
<aside class="sidebar">
  <div class="logo">Folio<span>.</span></div>

const GH_RAW='https://raw.githubusercontent.com/vanessacat-wq/folio-tw/main';
// 有預存 K線的美股清單（與 fetch_us_candles.py 同步）

const GAS_URL='https://script.google.com/macros/s/AKfycbxwLmXHvmEP-earzjVRu8QBvUCm5Zgi3QgAacHiqRULxjILGcOgZGB_7F0OxOJw0WpG/exec';

async function openCNBCHistory(){
  setNav('nav-ft');
  document.getElementById('pageTitle').textContent='CNBC Final Trade';
  document.getElementById('pageSub').textContent='推薦記錄 · Google Sheets 同步';
  const el=document.getElementById('contentArea');
  el.innerHTML=`
  <div class="ft-panel" style="margin-bottom:20px">
    <div class="ft-header">
      <div class="ft-cnbc">CNBC</div>
      <div class="ft-titles"><div class="ft-title">新增今日推薦</div><div class="ft-sub">輸入交易員推薦的股票，自動存入 Google Sheets</div></div>

    <div class="ft-body">

        <input class="ft-input" id="gasTrader" placeholder="交易員名稱 eg. Tim Seymour">

        <input class="ft-input" id="gasNote" placeholder="備註（選填）">
        <button class="btn btn-cnbc btn-sm" onclick="gasAdd()">新增 →</button>
      </div>
      <div id="gasMsg" style="font-size:13px;margin-top:8px"></div>
    </div>
  </div>
  <div class="card">

async function gasAdd(){
  const date=document.getElementById('gasDate').value;
  const trader=document.getElementById('gasTrader').value.trim();
  const sym=document.getElementById('gasSym').value.trim().toUpperCase();
  const note=document.getElementById('gasNote').value.trim();
  const msg=document.getElementById('gasMsg');
  if(!date||!trader||!sym){msg.style.color='var(--down)';msg.textContent='⚠️ 日期、交易員、代碼為必填';return;}
  msg.style.color='var(--text2)';msg.textContent='儲存中...';
  try{
    await fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:'add',date,trader,sym,note})});
    msg.style.color='var(--up)';msg.textContent=`✅ 已新增：${trader} 推薦 ${sym}`;
    document.getElementById('gasSym').value='';
    document.getElementById('gasNote').value='';
    document.getElementById('gasTrader').value='';
    gasLoad();
  }catch(e){msg.style.color='var(--down)';msg.textContent='❌ 儲存失敗，請重試';}
}

async function gasLoad(){
  const el=document.getElementById('gasTable');
  if(!el) return;
  try{
    const r=await fetch(GAS_URL+'?action=read');
    const d=await r.json();
    if(!d.ok||!d.records.length){el.innerHTML='<div style="padding:20px;text-align:center;color:var(--text3)">尚無記錄</div>';return;}
    const cutoff=new Date();cutoff.setMonth(cutoff.getMonth()-2);
    const recent=d.records.filter(r=>new Date(r.date)>=cutoff).reverse();
    el.innerHTML=`<div style="overflow-x:auto"><table class="data-table">
      <thead><tr><th>日期</th><th>交易員</th><th>代碼</th><th>現價</th><th>備註</th></tr></thead>
      <tbody id="gasTbody">
        ${recent.map(r=>`<tr>
          <td style="color:var(--text2)">${r.date}</td>
          <td style="font-weight:500">${r.trader}</td>
          <td style="font-family:monospace;font-weight:600;cursor:pointer;color:var(--accent)" onclick="qs('${r.sym}')">${r.sym}</td>
          <td id="gp-${r.sym}-${r.date}" style="font-size:12px;color:var(--text3)">載入中...</td>
          <td style="color:var(--text2);font-size:12px">${r.note||'—'}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>`;
    recent.forEach(async r=>{
      try{
        const wSym=/^\d{4}$/.test(r.sym)?r.sym+'.TW':r.sym;
        const q=await fetchQuote(wSym);
        const c=pct(q.price,q.prevClose);
        const isUp=c>=0;
        const cS=/^\d{4}$/.test(r.sym)?'NT$':'$';
        const td=document.getElementById(`gp-${r.sym}-${r.date}`);
        if(td) td.innerHTML=`<span style="font-weight:500">${cS}${fmt(q.price)}</span> <span style="color:${isUp?'var(--up)':'var(--down)'}">${isUp?'▲':'▼'}${Math.abs(c).toFixed(2)}%</span>`;
      }catch(e){}
    });
  }catch(e){el.innerHTML='<div style="padding:20px;text-align:center;color:var(--down)">載入失敗，請確認網路連線</div>';}
}

// ── API ──
function twseDate(offsetMonths=0){
  const d=new Date();
  if(d.getDay()===0)d.setDate(d.getDate()-2);
  if(d.getDay()===6)d.setDate(d.getDate()-1);
  d.setMonth(d.getMonth()-offsetMonths);
  return d.getFullYear()+''+String(d.getMonth()+1).padStart(2,'0')+'01';
}
function toNum(s){return parseFloat((s||'0').replace(/,/g,''));}

async function fetchTWSEMonth(sym4,ds){
  const url=`https://www.twse.com.tw/rwd/zh/afterTrading/STOCK_DAY?stockNo=${sym4}&date=${ds}&response=json`;
  const r=await fetch(url);
  if(!r.ok) return null;
  const data=await r.json();
  if(data.stat!=='OK'||!data.data||!data.data.length) return null;
  return{data:data.data,title:data.title||''};
}

async function fetchQuote(sym){
  const isTW=/^\d{4}$/.test(sym)||/\.TW$/i.test(sym);
  const sym4=sym.replace(/\.TW$/i,'');
  if(isTW){
    for(let m=0;m<=1;m++){
      try{
        const res=await fetchTWSEMonth(sym4,twseDate(m));
        if(!res) continue;
        const rows=res.data;
        const last=rows[rows.length-1];
        const prev=rows.length>=2?rows[rows.length-2]:null;
        const price=toNum(last[6]);
        if(!price||isNaN(price)) continue;
        const name=res.title.split(' ').slice(1,3).join(' ')||sym4;
        return{price,prevClose:prev?toNum(prev[6]):price,open:toNum(last[3]),high:toNum(last[4]),low:toNum(last[5]),
          volume:parseInt((last[1]||'0').replace(/,/g,'')),exchange:'TWSE',name,marketCap:0,hi52:0,lo52:0};
      }catch(e){continue;}
    }
    throw new Error('無法取得台股報價');
  }
  try{
    const r=await fetch(`https://finnhub.io/api/v1/quote?symbol=${sym}&token=${FKEY}`);
    const d=await r.json();
    if(d.c&&d.c>0){
      let name=sym,marketCap=0;
      try{
        const pr=await fetch(`https://finnhub.io/api/v1/stock/profile2?symbol=${sym}&token=${FKEY}`);
        const pd=await pr.json();
        if(pd.name){name=pd.name;marketCap=(pd.marketCapitalization||0)*1e6;}
      }catch(e){}
      return{price:d.c,prevClose:d.pc,open:d.o,high:d.h,low:d.l,volume:0,exchange:'US',name,marketCap,hi52:d.h,lo52:d.l};
    }
    throw new Error('no data');
  }catch(e){throw new Error('無法取得報價');}
}

// ── fetchCandles：台股用 TWSE，美股優先讀 GitHub 存好的 JSON ──
async function fetchCandles(sym){
  const isTW=/^\d{4}$/.test(sym)||/\.TW$/i.test(sym);
  const sym4=sym.replace(/\.TW$/i,'');

  if(isTW){
    const allRows=[];
    for(let m=0;m<=2;m++){
      try{
        const res=await fetchTWSEMonth(sym4,twseDate(m));
        if(res) res.data.forEach(row=>{
          const twYear=parseInt(row[0].split('/')[0])+1911;
          const [,mm,dd]=row[0].split('/');
          allRows.push({
            date:new Date(`${twYear}-${mm}-${dd}`),
            open:toNum(row[3]),high:toNum(row[4]),low:toNum(row[5]),close:toNum(row[6]),
            volume:parseInt((row[1]||'0').replace(/,/g,''))
          });
        });
      }catch(e){}
    }
    const valid=allRows.filter(c=>c.close&&!isNaN(c.close)).sort((a,b)=>a.date-b.date);
    return valid.length>5?valid:null;
  }

  // ── 美股 Step 1：讀 GitHub 預存的 K線 JSON（最快、最穩定）──
  if(US_CANDLES_STOCKS.has(sym)){
    try{
      const url=`${GH_RAW}/data/us_candles/${sym}.json?t=${Date.now()}`;
      const r=await fetch(url);
      if(r.ok){
        const d=await r.json();
        if(d.candles&&d.candles.length>10){
          // 標記來源供 UI 顯示
          const result=d.candles.map(c=>({date:new Date(c.date),open:c.open,high:c.high,low:c.low,close:c.close,volume:c.volume}));
          result._source='github';
          result._updated=d.updated||'';
          return result;
        }
      }
    }catch(e){console.warn(`GitHub K線讀取失敗 ${sym}:`,e);}
  }

  // ── 美股 Step 2：Finnhub 即時抓（fallback）──
  try{
    const from=Math.floor((Date.now()-100*86400000)/1000);
    const to=Math.floor(Date.now()/1000);
    const r=await fetch(`https://finnhub.io/api/v1/stock/candle?symbol=${sym}&resolution=D&from=${from}&to=${to}&token=${FKEY}`);
    const d=await r.json();
    if(d.s==='ok'&&d.t&&d.t.length>0){
      const result=d.t.map((t,i)=>({date:new Date(t*1000),open:d.o[i],high:d.h[i],low:d.l[i],close:d.c[i],volume:d.v[i]}));
      result._source='finnhub';
      return result;
    }
  }catch(e){}

  // ── 美股 Step 3：Stooq corsproxy（最後備援）──
  try{
    const stooqUrl=`https://stooq.com/q/d/l/?s=${sym.toLowerCase()}.us&i=d`;
    const proxy=`https://corsproxy.io/?${encodeURIComponent(stooqUrl)}`;
    const r=await fetch(proxy,{signal:AbortSignal.timeout(9000)});
    if(r.ok){
      const txt=await r.text();
      const lines=txt.trim().split('\n').slice(1);
      const c=lines.slice(-100).map(l=>{
        const v=l.split(',');
        return{date:new Date(v[0]),open:parseFloat(v[1]),high:parseFloat(v[2]),low:parseFloat(v[3]),close:parseFloat(v[4]),volume:parseInt(v[5]||0)};
      }).filter(c=>c.close&&!isNaN(c.close));
      if(c.length>10){c._source='stooq';return c;}
    }
  }catch(e){}
  return null;
}

// ── TECH ──
function computeTech(candles){
  if(!candles||candles.length<20) return null;
  const cls=candles.map(c=>c.close),vols=candles.map(c=>c.volume||0);
  const sma20=avg(cls.slice(-20)),sma50=cls.length>=50?avg(cls.slice(-50)):null,last=cls[cls.length-1];
  const rsi=calcRSI(cls,14);
  const e12=calcEMA(cls,12),e26=calcEMA(cls,26),ml=e12-e26;
  const ms=calcEMA(cls.map((_,i)=>i>=25?calcEMA(cls.slice(0,i+1),12)-calcEMA(cls.slice(0,i+1),26):0).slice(25),9);
  const macdH=ml-ms;
  const std=Math.sqrt(cls.slice(-20).reduce((s,c)=>s+(c-sma20)**2,0)/20);
  const bbU=sma20+2*std,bbL=sma20-2*std;
  const v5=avg(vols.slice(-5)),v20=avg(vols.slice(-20)),volR=v20>0?v5/v20:1;
  const ks=candles.slice(-9),kH=Math.max(...ks.map(c=>c.high||c.close)),kL=Math.min(...ks.map(c=>c.low||c.close));
  const k=kH===kL?50:(last-kL)/(kH-kL)*100;
  return{sma20,sma50,last,rsi,macdH,bbU,bbL,volR,k};
}
function avg(a){return a.reduce((s,v)=>s+v,0)/a.length;}
function calcEMA(data,p){const k=2/(p+1);let e=avg(data.slice(0,p));for(let i=p;i<data.length;i++)e=data[i]*k+e*(1-k);return e;}
function calcRSI(data,p){let g=0,l=0;for(let i=1;i<=p;i++){const d=data[i]-data[i-1];d>0?g+=d:l-=d;}let ag=g/p,al=l/p;for(let i=p+1;i<data.length;i++){const d=data[i]-data[i-1];ag=(ag*(p-1)+(d>0?d:0))/p;al=(al*(p-1)+(d<0?-d:0))/p;}return al===0?100:100-100/(1+ag/al);}

function aiScore(tech,chgP){
  if(!tech) return{rating:'WATCH',score:50,bull:[],bear:[]};
  const{rsi,macdH,sma20,sma50,last,bbU,bbL,volR,k}=tech;
  let sc=50,bull=[],bear=[];
  if(rsi<30){sc+=15;bull.push(`RSI ${rsi.toFixed(0)} 超賣，反彈機率高`);}
  else if(rsi<45){sc+=7;bull.push(`RSI ${rsi.toFixed(0)} 偏低，上漲空間存在`);}
  else if(rsi>70){sc-=15;bear.push(`RSI ${rsi.toFixed(0)} 超買，注意回調`);}
  else if(rsi>60){sc-=5;bear.push(`RSI ${rsi.toFixed(0)} 偏高，留意壓力`);}
  if(macdH>0){sc+=8;bull.push('MACD 翻正，多頭動能增強');}else{sc-=8;bear.push('MACD 為負，空頭壓力存在');}
  if(sma50&&last>sma50){sc+=10;bull.push('站上 50MA，多頭排列');}
  if(last>sma20){sc+=5;bull.push('站穩 20MA，短線支撐良好');}else{sc-=5;bear.push('跌破 20MA，短線偏弱');}
  if(last<bbL){sc+=10;bull.push('觸碰布林下軌，反彈機會存在');}else if(last>bbU){sc-=10;bear.push('觸碰布林上軌，可能回調');}
  if(volR>1.3){sc+=5;bull.push(`量能放大 ${(volR*100-100).toFixed(0)}%，市場關注提升`);}else if(volR<0.7){sc-=5;bear.push('量能萎縮，動能不足');}
  if(k<20){sc+=8;bull.push(`KD ${k.toFixed(0)} 低位，黃金交叉待確認`);}else if(k>80){sc-=8;bear.push(`KD ${k.toFixed(0)} 高位，死亡交叉注意`);}
  if(chgP>3){sc+=5;bull.push(`今日強勢 +${chgP.toFixed(2)}%`);}else if(chgP<-3){sc-=5;bear.push(`今日大跌 ${chgP.toFixed(2)}%`);}
  sc=Math.max(0,Math.min(100,sc));
  const rating=sc>=72?'BUY':sc>=58?'WATCH+':sc>=42?'HOLD':sc>=28?'WATCH-':'SELL';
  return{rating,score:sc,bull,bear};
}
function rCls(r){return r==='BUY'?'buy':r==='SELL'?'sell':r==='HOLD'?'hold':'watch';}
function makeForecast(quote,tech){
  const p=quote.price;
  let support=p*0.92,resist=p*1.10;
  if(tech){
    support=Math.max(quote.lo52||p*0.7,tech.bbL,(tech.sma50||tech.sma20)*0.95);
    resist=Math.min(quote.hi52||p*1.3,tech.bbU,(tech.sma50||tech.sma20)*1.08);
    if(resist<p)resist=p*1.05;if(support>p)support=p*0.95;
  }
  return{support:parseFloat(support.toFixed(2)),resist:parseFloat(resist.toFixed(2))};
}

}

// ── 自選股頁面 ──
function openWatchlist(){
  setNav('nav-wl');
  document.getElementById('pageTitle').textContent='自選股';
  document.getElementById('pageSub').textContent='我的追蹤清單';
  const el=document.getElementById('contentArea');
  if(!watchlist.length){
    el.innerHTML=`<div class="welcome-state">
      <div class="welcome-icon">⭐</div>
      <div class="welcome-title">自選股清單是空的</div>
      <div class="welcome-desc">分析任一股票後，點「⭐ 加入自選」即可追蹤。</div>
    </div>`;
    return;
  }
  el.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div class="section-title" style="margin:0">我的自選股 (${watchlist.length})</div>
      <button class="btn btn-sm btn-ghost" onclick="clearWL()">清除全部</button>
    </div>
    <div class="grid-3" id="wlGrid">
      ${watchlist.map(sym=>`
      <div class="card" style="cursor:pointer">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
          <div onclick="qs('${sym}')" style="flex:1">
            <div style="font-family:'DM Serif Display',serif;font-size:22px">${sym}</div>
            <div style="font-size:11px;color:var(--text3);margin-top:2px" id="wln-${sym}">載入中...</div>
          </div>
          <button onclick="removeWL('${sym}')" style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:20px;padding:0">×</button>
        </div>
        <div onclick="qs('${sym}')">
          <div style="font-size:26px;font-weight:600;letter-spacing:-1px" id="wlp-${sym}">—</div>
          <div style="font-size:13px;font-weight:500;margin-top:4px" id="wlchg-${sym}">—</div>
        </div>
      </div>`).join('')}
    </div>`;
  watchlist.forEach(async sym=>{
    try{
      const wSym=/^\d{4}$/.test(sym)?sym+'.TW':sym;
      const q=await fetchQuote(wSym);
      const c=pct(q.price,q.prevClose);
      const isUp=c>=0;
      const cS=/^\d{4}$/.test(sym)?'NT$':'$';
      const ne=document.getElementById('wln-'+sym);
      const pe=document.getElementById('wlp-'+sym);
      const ce=document.getElementById('wlchg-'+sym);
      if(ne) ne.textContent=q.name||sym;
      if(pe) pe.textContent=cS+fmt(q.price);
      if(ce){ce.textContent=(isUp?'▲':'▼')+' '+Math.abs(c).toFixed(2)+'%';ce.style.color=isUp?'var(--up)':'var(--down)';}
    }catch(e){}
  });
}

function removeWL(sym){
  watchlist=watchlist.filter(s=>s!==sym);
  localStorage.setItem('wl',JSON.stringify(watchlist));
  renderSidebarWL();
  openWatchlist();
}

function clearWL(){
  if(confirm('確定清除所有自選股？')){
    watchlist=[];
    localStorage.setItem('wl',JSON.stringify(watchlist));
    renderSidebarWL();
    openWatchlist();
  }
}

// ── WATCHLIST ──
function addWL(sym){
  if(!watchlist.includes(sym)){watchlist.push(sym);localStorage.setItem('wl',JSON.stringify(watchlist));renderSidebarWL();}
  alert(`${sym} 已加入自選股清單`);
}
async function renderSidebarWL(){
  const el=document.getElementById('sidebarWL');if(!el) return;
  let h='<div class="nav-label">自選股</div>';
  watchlist.slice(0,5).forEach(sym=>{h+=`<div class="wm-item" onclick="qs('${sym}')"><span class="wm-ticker">${sym}</span><span class="wm-chg" id="wmc-${sym}">—</span></div>`;});
  el.innerHTML=h;
  watchlist.slice(0,5).forEach(async sym=>{
    try{const wSym=/^\d{4}$/.test(sym)?sym+'.TW':sym;const q=await fetchQuote(wSym);const c=pct(q.price,q.prevClose);
      const e=document.getElementById('wmc-'+sym);if(e){e.className='wm-chg '+(c>=0?'chg-up':'chg-down');e.textContent=(c>=0?'+':'')+c.toFixed(2)+'%';}}catch(e){}
  });
}

// ── UTILS ──
function pct(p,prev){return prev?((p-prev)/prev*100):0;}
function fmt(n,d=2){return n!=null?n.toLocaleString('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';}
function fmtV(v){if(!v)return'—';if(v>=1e9)return(v/1e9).toFixed(2)+'B';if(v>=1e6)return(v/1e6).toFixed(2)+'M';if(v>=1e3)return(v/1e3).toFixed(0)+'K';return v;}
function showErr(msg){
  document.getElementById('contentArea').innerHTML=`<div class="err-msg">⚠️ ${msg}</div>
  <div class="welcome-state"><div class="welcome-title">請重新搜尋</div>
  <div class="welcome-desc">台股：4位數字（2330）<br>美股：英文代碼（AAPL）</div></div>
  <div id="ftPanel" style="margin-top:24px"></div>`;
  buildFTPanel();
}

renderSidebarWL();
renderHome();
